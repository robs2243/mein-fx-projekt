name: Multi-Platform Native Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: hello-linux
            binary-path: target/hello-javafx-native
          - os: windows-latest
            artifact-name: hello-windows
            binary-path: target/hello-javafx-native.exe
          - os: macos-latest
            artifact-name: hello-macos
            binary-path: target/hello-javafx-native

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libfontconfig1-dev \
            libharfbuzz-dev libgtk-3-dev libglib2.0-dev \
            libcairo2-dev libpango1.0-dev libatk1.0-dev \
            libgdk-pixbuf-2.0-dev libgl-dev zlib1g-dev \
            libfreetype-dev libasound2-dev

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup GraalVM (Liberica NIK)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Image
        run: mvn -Pnative package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-path }}
          retention-days: 5
          
      - name: Show Error Report (Windows)
        if: failure() && matrix.os == 'windows-latest'
        run: |
          $report = Get-ChildItem -Path target -Filter "svm_err_*.md" | Select-Object -First 1
          if ($report) { Get-Content $report.FullName }
        shell: pwsh
        
      - name: Upload Error Report (Windows)
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-error-report
          path: target/svm_err_*.md
