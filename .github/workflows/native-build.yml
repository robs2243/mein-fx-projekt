name: Multi-Platform Native Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Erlaubt manuelles Starten per Klick auf GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Wenn ein System scheitert, sollen die anderen trotzdem weiterbauen
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: hello-linux
            binary-path: target/hello-javafx-native
          - os: windows-latest
            artifact-name: hello-windows
            binary-path: target/hello-javafx-native.exe
          - os: macos-latest
            artifact-name: hello-macos
            binary-path: target/hello-javafx-native

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Spezielle Grafik-Abhängigkeiten für Linux (wichtig für JavaFX!)
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev libxxf86vm-dev

      # Setup Liberica NIK (GraalVM + JavaFX)
      - name: Setup GraalVM (Liberica NIK)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx' # Das lädt automatisch die "Full"-Version mit JavaFX
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # Der eigentliche Build-Befehl
      - name: Build Native Image with Maven
        run: mvn -Pnative package

      # Die fertige Datei hochladen
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-path }}
          retention-days: 5 # Wie lange die Datei gespeichert werden soll
